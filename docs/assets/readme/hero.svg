<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Life Remake — 可控叙事 Agent</title>
  <desc id="hero-desc">引擎掌握规则，模型负责叙事。支持古代权谋、奇幻世界和现代都市的 AI 人生游戏。</desc>
  <style>
    .canvas { fill: #111416; }
    .light { fill: #edf0ed; font-family: "Microsoft YaHei", Arial, sans-serif; font-weight: 700; }
    .dim { fill: #8b949e; font-family: "Microsoft YaHei", Arial, sans-serif; }
    .title { fill: #c69a4b; font-family: Georgia, "Times New Roman", "Microsoft YaHei", serif; font-weight: 700; }
    .line { stroke: #c69a4b; fill: none; }
    .pill { fill: #1a1f22; stroke: #394246; stroke-width: 1; }
    .pill-text { fill: #b8c1be; font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 14px; }
  </style>
  <rect class="canvas" width="1200" height="420" rx="10"/>
  <path class="line" opacity=".3" d="M100 48 H1100 M100 372 H1100"/>
  <path class="line" opacity=".35" d="M100 48 L100 64 M100 48 L116 48 M1100 48 L1100 64 M1100 48 L1084 48 M100 372 L100 356 M100 372 L116 372 M1100 372 L1100 356 M1100 372 L1084 372"/>
  <text x="600" y="150" text-anchor="middle" class="title" font-size="68" letter-spacing="6">Life Remake</text>
  <path class="line" opacity=".5" d="M430 174 H770"/>
  <text x="600" y="226" text-anchor="middle" class="light" font-size="30" letter-spacing="8">真正可控的叙事 Agent</text>
  <text x="600" y="268" text-anchor="middle" class="dim" font-size="18" letter-spacing="3">引擎掌握规则 · 模型负责故事 · 选择留在此后的人生</text>
  <g transform="translate(348 300)">
    <rect class="pill" width="150" height="38" rx="19"/><text class="pill-text" x="75" y="25" text-anchor="middle">古代权谋</text>
  </g>
  <g transform="translate(525 300)">
    <rect class="pill" width="150" height="38" rx="19"/><text class="pill-text" x="75" y="25" text-anchor="middle">奇幻世界</text>
  </g>
  <g transform="translate(702 300)">
    <rect class="pill" width="150" height="38" rx="19"/><text class="pill-text" x="75" y="25" text-anchor="middle">现代都市</text>
  </g>
</svg>
