  </g>
  <path class="soft" d="M622 374 H140 V280"/><path class="accent" d="M134 284 L140 272 L146 284 Z"/>
  <text x="274" y="357" class="muted">Digest 与已提交经历进入下一轮按需召回</text>
  <rect class="tag" x="54" y="456" width="1092" height="24" rx="12"/><text class="tagtext" x="600" y="472" text-anchor="middle">WORLD PACK + TOOL CALLS + DETERMINISTIC ENGINE + ANONYMOUS SAVE</text>
