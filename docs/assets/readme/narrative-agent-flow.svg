<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Life Remake 叙事 Agent 完整运行链路</title>
  <desc id="desc">上下文编排依次进入幕间规划、单回合规划、精确召回与渲染、引擎结算和原子提交，已提交回合由异步记忆整理器生成长期摘要。</desc>
  <style>
    .canvas { fill: #111416; }
    .panel { fill: #1a1f22; stroke: #3a4549; stroke-width: 1.5; }
    .accent { fill: #c69a4b; }
    .light { fill: #edf0ed; font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 17px; font-weight: 700; }
    .muted { fill: #afbab8; font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 13px; }
    .small { fill: #8e9996; font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 12px; }
    .line { stroke: #c69a4b; stroke-width: 2; fill: none; }
    .soft { stroke: #687470; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; }
    .tag { fill: #263035; }
    .tagtext { fill: #d8e0da; font-family: Arial, sans-serif; font-size: 11px; font-weight: 700; }
  </style>
  <rect class="canvas" width="1200" height="500" rx="10"/>
  <text x="54" y="48" class="light" font-size="24">叙事 Agent：规划、生成、裁决与记忆</text>
  <text x="54" y="75" class="muted">模型获得创作空间；运行状态、数值、时间与结局始终由引擎掌握。</text>
