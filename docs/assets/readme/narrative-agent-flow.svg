<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Life Remake 叙事 Agent 完整运行链路</title>
  <desc id="desc">边镇路线以本幕主持资料和唯一历史供应当前事件，正文及确定性结果提交后观察本幕或整局收束；继续时独立规划下一事件组。连续性只供展示，历史按时段异步压缩。</desc>
  <style>
    .canvas { fill: #111416; }
    .panel { fill: #1a1f22; stroke: #3a4549; stroke-width: 1.5; }
    .accent { fill: #c69a4b; }
    .light { fill: #edf0ed; font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 17px; font-weight: 700; }
    .muted { fill: #afbab8; font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 13px; }
    .small { fill: #8e9996; font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 12px; }
    .line { stroke: #c69a4b; stroke-width: 2; fill: none; }
    .soft { stroke: #687470; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; }
    .tag { fill: #263035; }
    .tagtext { fill: #d8e0da; font-family: Arial, sans-serif; font-size: 11px; font-weight: 700; }
  </style>
  <rect class="canvas" width="1200" height="500" rx="10"/>
  <text x="54" y="48" class="light" font-size="24">边镇事件组：主持、提交、收束与独立接组</text>
  <text x="54" y="75" class="muted">模型判断故事意义；引擎处理时间、数值、掷点、库存和可恢复提交。</text>
  <path class="line" d="M224 190 H252 M422 190 H450 M620 190 H648 M818 190 H846 M1016 190 H1044"/>
  <path class="accent" d="M248 184 L260 190 L248 196 Z M446 184 L458 190 L446 196 Z M644 184 L656 190 L644 196 Z M842 184 L854 190 L842 196 Z M1040 184 L1052 190 L1040 196 Z"/>
  <g transform="translate(54 118)">
    <rect class="panel" width="170" height="144" rx="8"/><circle class="accent" cx="24" cy="25" r="6"/>
    <text class="light" x="39" y="31">幕初资料</text><text class="muted" x="20" y="62">IF 与人工事件组</text><text class="muted" x="20" y="84">局势、人物与压力</text><text class="muted" x="20" y="106">适用制度原文</text><text class="small" x="20" y="130">整幕固定 · 按职责供应</text>
  </g>
  <g transform="translate(252 118)">
    <rect class="panel" width="170" height="144" rx="8"/><circle class="accent" cx="24" cy="25" r="6"/>
    <text class="light" x="39" y="31">故事历史</text><text class="muted" x="20" y="62">各时期大事概要</text><text class="muted" x="20" y="84">未覆盖实际对话</text><text class="muted" x="20" y="106">当前人物与节点</text><text class="small" x="20" y="130">同一历史入口 · 不叠档案</text>
  </g>
  <g transform="translate(450 118)">
    <rect class="panel" width="170" height="144" rx="8"/><circle class="accent" cx="24" cy="25" r="6"/>
    <text class="light" x="39" y="31">正文与抉择</text><text class="muted" x="20" y="62">当前事件经历</text><text class="muted" x="20" y="84">玩家选完整取舍</text><text class="muted" x="20" y="106">结果落实确定成败</text><text class="small" x="20" y="130">明确同年／跨年交接</text>
  </g>
  <g transform="translate(648 118)">
    <rect class="panel" width="170" height="144" rx="8"/><circle class="accent" cx="24" cy="25" r="6"/>
    <text class="light" x="39" y="31">结算与提交</text><text class="muted" x="20" y="62">属性、时间与道具</text><text class="muted" x="20" y="84">正文与掷点持久化</text><text class="muted" x="20" y="106">角色卡只供展示</text><text class="small" x="20" y="130">重试复用 · 不重掷</text>
  </g>
  <g transform="translate(846 118)">
    <rect class="panel" width="170" height="144" rx="8"/><circle class="accent" cx="24" cy="25" r="6"/>
    <text class="light" x="39" y="31">收束观察</text><text class="muted" x="20" y="62">完整组后观察</text><text class="muted" x="20" y="84">本幕／整局结果</text><text class="muted" x="20" y="106">结局等级与生死</text><text class="small" x="20" y="130">不读取下一组候选</text>
  </g>
  <g transform="translate(1044 118)">
    <rect class="panel" width="102" height="144" rx="8"/><circle class="accent" cx="22" cy="25" r="6"/>
    <text class="light" x="17" y="62">接组规划</text><text class="muted" x="12" y="86">继续时调用</text><text class="muted" x="12" y="108">上一组结果</text><text class="small" x="12" y="130">只选下一组</text>
  </g>
  <path class="soft" d="M730 280 V306 H730 V318"/><path class="accent" d="M724 306 L730 318 L736 306 Z"/>
  <g transform="translate(622 318)">
    <rect class="panel" width="216" height="112" rx="8"/><circle class="accent" cx="24" cy="25" r="6"/>
    <text class="light" x="40" y="31">Memory Curator</text><text class="muted" x="20" y="62">仅本时段原文</text><text class="muted" x="20" y="82">独立的大事概要</text><text class="small" x="20" y="102">异步 · 按来源精确替换</text>
  </g>
  <path class="soft" d="M622 374 H337 V280"/><path class="accent" d="M331 284 L337 272 L343 284 Z"/>
  <text x="54" y="329" class="muted">观察收束 → 换幕或结局</text>
  <text x="54" y="414" class="muted">下一段沿当前组或已选新组继续；历史只由概要与未覆盖原文供应。</text>
  <rect class="tag" x="54" y="456" width="1092" height="24" rx="12"/><text class="tagtext" x="600" y="472" text-anchor="middle">WORLD PACK + TOOL CALLS + DETERMINISTIC ENGINE + ANONYMOUS SAVE</text>
</svg>
