  <path class="accent" d="M248 184 L260 190 L248 196 Z M446 184 L458 190 L446 196 Z M644 184 L656 190 L644 196 Z M842 184 L854 190 L842 196 Z M1040 184 L1052 190 L1040 196 Z"/>
